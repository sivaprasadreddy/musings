<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sl="https://shadleaf.dev/sl"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content" class="stack feed-page">
    <sl:card sec:authorize="isAuthenticated()" aria-labelledby="new-post-heading">
        <sl:card-content>
            <sl:collapsible class="post-composer" th:object="${postForm}" th:open="${#fields.hasAnyErrors()}">
                <sl:collapsible-trigger>
                    <h1 id="new-post-heading" class="section-title">Post a message</h1>
                    <sl:icon name="chevron-down" class="post-composer-icon"/>
                </sl:collapsible-trigger>
                <sl:collapsible-content>
                    <form method="post" th:action="@{/posts}" th:object="${postForm}" class="stack composer-form">
                        <sl:form-errors/>
                        <sl:field th:field="*{title}">
                            <sl:field-label>Title</sl:field-label>
                            <sl:input required maxlength="200"/>
                            <sl:field-error/>
                        </sl:field>
                        <sl:field th:field="*{content}">
                            <sl:field-label>Content</sl:field-label>
                            <sl:textarea required maxlength="10000" rows="4"/>
                            <sl:field-error/>
                        </sl:field>
                        <div><sl:button type="submit">Post message</sl:button></div>
                    </form>
                </sl:collapsible-content>
            </sl:collapsible>
        </sl:card-content>
    </sl:card>
    <section aria-labelledby="posts-heading" class="stack">
        <h2 id="posts-heading" class="section-title">Latest messages</h2>
        <sl:empty border th:if="${posts.data.isEmpty()}">
            <sl:empty-header>
                <sl:empty-media variant="icon"><sl:icon name="message-square"/></sl:empty-media>
                <sl:empty-title level="3">No messages yet</sl:empty-title>
                <sl:empty-description>Share the first one!</sl:empty-description>
            </sl:empty-header>
        </sl:empty>
        <div id="post-feed" class="stack">
            <th:block th:replace="~{posts/feed :: feed}"></th:block>
        </div>
    </section>
</div>
</body>
</html>
