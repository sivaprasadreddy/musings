<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <div class="mx-auto max-w-5xl space-y-8">
        <section sec:authorize="isAuthenticated()" class="rounded-lg bg-white p-6 shadow-sm border border-gray-200" aria-labelledby="new-post-heading">
            <details class="post-composer" th:object="${postForm}" th:open="${#fields.hasAnyErrors()}">
                <summary class="flex cursor-pointer items-center justify-between rounded-md focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-gray-800">
                    <h1 id="new-post-heading" class="text-xl font-semibold text-gray-900">Post a message</h1>
                    <i class="fas fa-chevron-down post-composer-icon text-gray-600" aria-hidden="true"></i>
                </summary>
                <form method="post" th:action="@{/posts}" th:object="${postForm}" class="mt-4 space-y-4">
                    <div>
                        <label for="title" class="block text-sm font-medium text-gray-700">Title</label>
                        <input type="text" th:field="*{title}" required maxlength="200"
                               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2"/>
                        <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="mt-1 text-sm text-red-600"></p>
                    </div>
                    <div>
                        <label for="content" class="block text-sm font-medium text-gray-700">Content</label>
                        <textarea th:field="*{content}" required maxlength="10000" rows="4"
                                  class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2"></textarea>
                        <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="mt-1 text-sm text-red-600"></p>
                    </div>
                    <button type="submit" class="rounded-md bg-gray-800 px-5 py-2 text-sm font-medium text-white hover:bg-gray-700">Post message</button>
                </form>
            </details>
        </section>
        <section aria-labelledby="posts-heading">
            <h2 id="posts-heading" class="mb-4 text-xl font-semibold text-gray-900">Latest messages</h2>
            <p th:if="${posts.data.isEmpty()}" class="rounded-lg bg-white p-6 text-gray-500 border border-gray-200">No messages yet. Share the first one!</p>
            <div id="post-feed" class="space-y-4">
                <th:block th:replace="~{posts/feed :: feed}"></th:block>
            </div>
        </section>
    </div>
</div>
</body>
</html>
