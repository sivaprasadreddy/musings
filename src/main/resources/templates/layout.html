<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sl="https://shadleaf.dev/sl"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE" th:text="#{app.name}">Musings</title>
    <th:block th:replace="~{sl/layout :: theme-script}"></th:block>
    <th:block th:replace="~{sl/layout :: assets}"></th:block>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<sl:skip-link/>
<sl:sidebar-provider>
    <sl:site-header>
        <sl:sidebar-trigger aria-label="Menu"><sl:icon name="menu"/></sl:sidebar-trigger>
        <sl:button as="a" th:href="@{/}" variant="ghost">
            <sl:slot name="icon-start"><sl:icon name="message-square-text"/></sl:slot>
            <span th:text="#{app.name}">Musings</span>
        </sl:button>
        <sl:sidebar placement="header" variant="inset">
            <sl:sidebar-header panel-only>
                <sl:sidebar-menu>
                    <sl:sidebar-menu-item>
                        <sl:sidebar-menu-button th:href="@{/}" size="lg">
                            <sl:slot name="icon-start"><span class="app-logo"><sl:icon name="message-square-text"/></span></sl:slot>
                            <strong th:text="#{app.name}">Musings</strong>
                        </sl:sidebar-menu-button>
                    </sl:sidebar-menu-item>
                </sl:sidebar-menu>
            </sl:sidebar-header>
            <sl:sidebar-content>
                <sl:sidebar-group id="nav-main">
                    <sl:sidebar-group-content>
                        <sl:sidebar-menu>
                            <sl:sidebar-menu-item>
                                <sl:sidebar-menu-button th:href="@{/}" th:active="${#slNav.current('/')}">
                                    <sl:slot name="icon-start"><sl:icon name="house"/></sl:slot>
                                    Feed
                                </sl:sidebar-menu-button>
                            </sl:sidebar-menu-item>
                        </sl:sidebar-menu>
                    </sl:sidebar-group-content>
                </sl:sidebar-group>
            </sl:sidebar-content>
        </sl:sidebar>
        <sl:slot name="end">
            <sl:theme-toggle/>
            <sl:user-menu placement="header"/>
        </sl:slot>
    </sl:site-header>
    <sl:sidebar-inset>
        <main class="page">
            <sl:alert th:if="${successMessage}" role="status" class="flash">
                <sl:icon name="circle-check"/>
                <sl:alert-title th:text="${successMessage}">Success</sl:alert-title>
            </sl:alert>
            <sl:alert th:if="${errorMessage}" variant="destructive" role="alert" class="flash">
                <sl:icon name="circle-alert"/>
                <sl:alert-title th:text="${errorMessage}">Error</sl:alert-title>
            </sl:alert>
            <div layout:fragment="content">
                <!-- Page content -->
            </div>
        </main>
    </sl:sidebar-inset>
</sl:sidebar-provider>
<script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
<script th:src="@{/js/post-likes.js}"></script>
<div layout:fragment="pageScripts"></div>
</body>
</html>
