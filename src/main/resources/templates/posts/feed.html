<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl">
<body>
<th:block th:fragment="feed">
    <sl:card th:each="post : ${posts.data}">
        <sl:card-header>
            <sl:card-title level="3" class="post-title" th:text="${post.title}">Post title</sl:card-title>
            <sl:card-description>
                <span th:text="${post.authorName}">Author</span>
                <span aria-hidden="true"> &middot; </span>
                <time th:datetime="${post.createdAt}" th:text="${#temporals.format(post.createdAt, 'd MMM yyyy, h:mm a z', 'UTC')}">Posted at</time>
            </sl:card-description>
        </sl:card-header>
        <sl:card-content>
            <p class="post-content" th:text="${post.content}">Post content</p>
        </sl:card-content>
        <sl:card-footer>
            <div th:replace="~{posts/likes :: likes(likes=${postLikes.get(post.id)})}"></div>
        </sl:card-footer>
    </sl:card>
    <div th:if="${posts.hasNextPage}" class="load-more">
        <sl:button variant="outline" th:attr="hx-get=@{/posts(page=${posts.currentPageNo + 1})}"
                   hx-target="closest div" hx-swap="outerHTML">Load more</sl:button>
    </div>
</th:block>
</body>
</html>
