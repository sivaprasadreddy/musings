<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="likes" th:id="|post-likes-${likes.postId}|" class="post-likes" aria-live="polite">
    <form sec:authorize="isAuthenticated()" method="post"
          th:action="@{/posts/{id}/{action}(id=${likes.postId},action=${likes.liked ? 'unlike' : 'like'})}"
          th:attr="hx-post=@{/posts/{id}/{action}(id=${likes.postId},action=${likes.liked ? 'unlike' : 'like'})}"
          hx-target="closest .post-likes" hx-swap="outerHTML" hx-disable="find button"
          hx-status:4xx="swap:none" hx-status:5xx="swap:none">
        <sl:button type="submit" variant="outline" size="icon-sm"
                   th:aria-pressed="${likes.liked}"
                   th:aria-label="${likes.liked ? 'Unlike' : 'Like'}"
                   th:title="${likes.liked ? 'Unlike' : 'Like'}"
                   th:classappend="${likes.liked ? 'liked' : ''}">
            <sl:icon name="heart"/>
        </sl:button>
    </form>
    <span th:if="${likes.count > 0}" class="like-count" th:text="${likes.count}">1</span>
    <span class="like-error" role="alert"></span>
</div>
</body>
</html>
