<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sl="https://shadleaf.dev/sl"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Login</title>
</head>
<body>
<div layout:fragment="content" class="centered">
    <sl:card class="login-card">
        <sl:card-header>
            <sl:card-title level="1">Welcome back</sl:card-title>
            <sl:card-description>Sign in to your account.</sl:card-description>
        </sl:card-header>
        <sl:card-content class="stack">
            <sl:alert th:if="${param.error}" variant="destructive" role="alert">
                <sl:icon name="circle-alert"/>
                <sl:alert-title>Invalid email or password.</sl:alert-title>
            </sl:alert>
            <sl:alert th:if="${message}" role="status">
                <sl:icon name="circle-check"/>
                <sl:alert-title th:text="${message}">Success Message</sl:alert-title>
            </sl:alert>
            <sl:alert th:if="${param.logout}" role="status">
                <sl:icon name="circle-check"/>
                <sl:alert-title>You have been logged out.</sl:alert-title>
            </sl:alert>
            <form id="loginForm" method="post" th:action="@{/login}" class="stack">
                <sl:field for="username">
                    <sl:field-label>Email</sl:field-label>
                    <sl:input type="email" id="username" name="username" required autocomplete="email"
                              placeholder="you@example.com"/>
                </sl:field>
                <sl:field for="password">
                    <sl:field-label>Password</sl:field-label>
                    <sl:input type="password" id="password" name="password" required
                              autocomplete="current-password" placeholder="Enter your password"/>
                </sl:field>
                <sl:button type="submit" class="full-width">
                    <sl:slot name="icon-start"><sl:icon name="log-in"/></sl:slot>
                    Sign in
                </sl:button>
            </form>
        </sl:card-content>
    </sl:card>
</div>
</body>
</html>
